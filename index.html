<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suhail Khalifaturahman | Profile Link</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Variabel Dasar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #0d0f12;
      color: #e0e6ed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow (Efek Futuristik) */
    .glow-bg {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Kartu Profil Glassmorphism */
    .profile-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.15);
    }

    /* Foto Profil dengan Ring Neon Gradasi Hijau */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #10b981;
      padding: 4px;
      background: linear-gradient(135deg, #10b981, #059669);
    }

    /* Tipografi */
    .name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #10b981, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .description {
      font-size: 0.95rem;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Tombol Link Sosial Media */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #f3f4f6;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .link-btn:hover {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #000000;
      border-color: #10b981;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }

    /* Footer */
    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #6b7280;
      text-align: center;
      z-index: 1;
    }

    /* Responsif untuk Layar Sangat Kecil (Mobile) */
    @media (max-width: 360px) {
      .profile-card {
        padding: 30px 20px;
      }
      .name {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <main class="profile-card" id="card">
    
    <div class="avatar-wrapper">
      <img src="profil.jpg" alt="Suhail Khalifaturahman" class="avatar-img" onerror="this.src='profil.jpg'">
    </div>

    <h1 class="name">Suhail Khalifaturahman</h1>
    <p class="tagline">Santri Al Bunyan & Web Dev</p>
    <p class="description">
      Mengintegrasikan ilmu dan teknologi melalui pengembangan web yang fungsional dan estetis.
    </p>

    <div class="links-container">
      <a href="https://wa.me/62895322729044" target="_blank" class="link-btn" onclick="logClick('WhatsApp')">
        WhatsApp (0895322729044)
      </a>
      <a href="https://instagram.com/fathuurr0104" target="_blank" class="link-btn" onclick="logClick('Instagram')">
        Instagram (@fathuurr0104)
      </a>
    </div>

  </main>

  <footer>
    &copy; 2025 Suhail Khalifaturahman
  </footer>

  <script>
    // Fungsi log sederhana saat tombol diklik
    function logClick(platform) {
      console.log(`Pengunjung membuka link: ${platform}`);
    }

    // Efek Tilting 3D Halus pada Desktop
    const card = document.getElementById('card');

    if (window.innerWidth > 768) {
      document.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });

      document.addEventListener('mouseleave', () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
      });
    }
  </script>
</body>
</html>
